services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: admin321
      POSTGRES_DB: first_db
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:admin321@db/first_db
    depends_on:
      - db
volumes:
  pgdata:
